name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Check
        if: matrix.node-version == 24
        run: pnpm check

      - name: Check docs
        if: matrix.node-version == 24
        run: pnpm check:docs

      - name: Coverage
        if: matrix.node-version == 24
        run: pnpm test:coverage

      - name: Check package exports
        run: pnpm --filter facturas check:exports

      - name: Pack check
        if: matrix.node-version == 24
        run: pnpm pack:check
